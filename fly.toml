# fly.toml app configuration file generated for thepredictiongame on 2026-07-29T01:33:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# All table state lives in ONE process's memory (see CLAUDE.md). Never run
# more than 1 machine -- two would strand players on tables the other
# machine can't see, which looks identical to the "kicked on join" bug.
# `fly deploy`/`fly launch` default to 2 machines for HA; always deploy with
# `fly deploy --ha=false`, and if a deploy ever adds a second machine, run
# `fly scale count 1` to undo it.

app = 'thepredictiongame'
primary_region = 'ewr'

[build]
[env]
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
